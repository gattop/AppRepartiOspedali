# Reparti Ospedali: app + oauth2-proxy (Keycloak) dietro Traefik.
#
#   Internet -> Traefik (rete "proxy") -> oauth2-proxy :4180 -> app :3000 (rete interna)
#
# L'app non è mai sulla rete di Traefik: ogni richiesta passa da oauth2-proxy. La consultazione
# è pubblica; chi accede (Keycloak) viene passato all'app negli header X-Forwarded-* e, se ha
# il ruolo, può modificare.
#
# Qui c'è tutta la configurazione non segreta (con valori di default sovrascrivibili).
# I segreti stanno solo nel file .env sulla VPS, che non va nel repo: vedi .env.example.

services:
  app:
    image: ${IMAGE:-ghcr.io/gattop/apprepartiospedali}:${TAG:-latest}
    restart: unless-stopped
    environment:
      # Ruoli Keycloak che possono modificare i dati; vuoto = tutti gli utenti autenticati
      EDITOR_GROUPS: ${EDITOR_GROUPS-role:reparti-editor,role:reparti:reparti-editor}
      # true = al primo avvio carica anche gli ospedali di esempio (finti)
      SEED_DEMO: ${SEED_DEMO:-false}
      # Snapshot giornaliero consistente del database in ./backup, tiene gli ultimi N
      BACKUPS_TO_KEEP: ${BACKUPS_TO_KEEP:-3}
    volumes:
      # Database SQLite vivo: NON copiarlo a caldo, usa gli snapshot in ./backup
      - ./data:/data
      # Solo snapshot già consistenti (reparti-AAAA-MM-GG.db): sicuri da copiare
      - ./backup:/backup
    networks:
      internal:
        aliases:
          - reparti-app

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://login.gattp.it/realms/vps.homelab}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:-reparti}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?imposta OIDC_CLIENT_SECRET nel .env}
      # Keycloak mette solo "account" nel campo aud dei token: senza questa riga il login dà 500.
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES: account
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET:?imposta COOKIE_SECRET nel .env}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://reparti-app:3000/
      OAUTH2_PROXY_REDIRECT_URL: https://${APP_HOST:-ospedali.kyrie.ee}/oauth2/callback
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_NAME: _reparti
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # Gli equipaggi tengono l'app aperta per tutto il turno: sessione lunga, rinnovata in silenzio.
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      # Consultazione pubblica: la pagina, i file dell'app e i dati (GET /api/data) non chiedono
      # il login. Il login serve solo per /api/me (chi sei) e per qualsiasi modifica.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: 'GET=^/($$|(app|util|map3d|sw)\.js$$|app\.css$$|manifest\.webmanifest$$|favicon\.ico$$|icons/|api/data$$|healthz$$)'
      # Sulle richieste pubbliche toglie eventuali header di identità falsificati dal client.
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.reparti-ospedali.rule=Host(`${APP_HOST:-ospedali.kyrie.ee}`)
      - traefik.http.routers.reparti-ospedali.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.reparti-ospedali.tls=true
      - traefik.http.routers.reparti-ospedali.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.reparti-ospedali.loadbalancer.server.port=4180

networks:
  internal:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
